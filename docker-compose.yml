services:
  db:
    image: mysql:8.4
    container_name: ugb-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-devopsdb}
      MYSQL_USER: ${DB_USER:-devops}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devops123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./app
    image: ${API_IMAGE:-ugb-devops-api:local}
    container_name: ugb-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-devopsdb}
      DB_USER: ${DB_USER:-devops}
      DB_PASSWORD: ${DB_PASSWORD:-devops123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: ugb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
